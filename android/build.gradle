buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/WebmPlayer+autolinking.gradle'
apply from: "./fix-prefab.gradle"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["WebmPlayer_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["WebmPlayer_" + name]).toInteger()
}

android {
  namespace "com.webmplayer"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
          "META-INF",
          "META-INF/**"
      ]
    }
    // The app (React Native) ships these; packaging them again in the AAR
    // would collide at app merge time.
    jniLibs {
      excludes += [
          "**/libc++_shared.so",
          "**/libfbjni.so",
          "**/libjsi.so",
          "**/libfolly_json.so",
          "**/libfolly_runtime.so",
          "**/libglog.so",
          "**/libhermes.so",
          "**/libhermes-executor-debug.so",
          "**/libhermes_executor.so",
          "**/libreactnative.so",
          "**/libreactnativejni.so",
          "**/libturbomodulejsijni.so",
          "**/libreact_nativemodule_core.so",
          "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable += "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      // The worklet build emits feeder.bundle here; WorkletSource opens it by that asset name.
      assets.srcDirs += '../worklet/dist'
    }
  }
}

repositories {
  mavenCentral()
  google()
}

// The worklet's native addons go into react-native-bare-kit's addon directory,
// which that module packages as jniLibs, so the app needs no bare-link step of
// its own. It must run before that module merges its jniLibs, hence the
// cross-project dependency added once every project is evaluated.
def linkBareAddons = tasks.register("linkBareAddons", Exec) {
  workingDir file("${projectDir}/..")
  commandLine "node", "scripts/link-bare-addons.js", "android"
}
tasks.named("preBuild").configure { dependsOn(linkBareAddons) }
gradle.projectsEvaluated {
  def bareKit = rootProject.findProject(":react-native-bare-kit")
  if (bareKit != null) {
    bareKit.tasks.named("preBuild").configure { dependsOn(linkBareAddons) }
  }
}


dependencies {
  // The app's React Native gradle plugin substitutes the installed react-android.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // bare-kit's Worklet and IPC classes: the feeder worklet joins the broadcast swarm.
  implementation project(":react-native-bare-kit")

  // ExoPlayer owns demux, decode and A/V sync on Android. media3-extractor
  // supplies MatroskaExtractor, which reads the same muxed WebM bytes that
  // libwebm parses on iOS. media3-ui provides PlayerView for the video surface.
  def media3Version = "1.11.1"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-extractor:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
}
